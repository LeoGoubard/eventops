[project]
name = "eventops"
version = "0.1.0"
description = "Back-office for webinar and online event organisers: events, speakers, pre-live checklists, contacts and sales."
requires-python = ">=3.12"
# Dependencies live in requirements.txt / requirements-dev.txt

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ", "SIM"]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
strict_optional = true
ignore_missing_imports = true
exclude = ["migrations/"]

[tool.django-stubs]
django_settings_module = "config.settings"
