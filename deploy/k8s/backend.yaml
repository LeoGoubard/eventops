apiVersion: apps/v1
kind: Deployment
metadata:
  name: eventops-backend
  labels: { app: eventops-backend }
spec:
  replicas: 2
  selector:
    matchLabels: { app: eventops-backend }
  template:
    metadata:
      labels: { app: eventops-backend }
    spec:
      initContainers:
        - name: migrate
          image: ghcr.io/leogoubard/eventops-backend:latest
          command: ["python", "manage.py", "migrate", "--noinput"]
          envFrom:
            - secretRef: { name: eventops-backend }
      containers:
        - name: backend
          image: ghcr.io/leogoubard/eventops-backend:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef: { name: eventops-backend }
          readinessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 15
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { cpu: 500m, memory: 384Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector: { app: eventops-backend }
  ports:
    - port: 8000
      targetPort: 8000
