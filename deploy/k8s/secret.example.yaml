# Copy to secret.yaml (git-ignored), fill in real values, then: kubectl apply -f secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: eventops-backend
type: Opaque
stringData:
  DATABASE_URL: postgres://USER:PASSWORD@HOST:5432/eventops
  DJANGO_SECRET_KEY: change-me
  STRIPE_WEBHOOK_SECRET: change-me
  DJANGO_DEBUG: "false"
  DJANGO_ALLOWED_HOSTS: eventops.example.com
  DJANGO_CSRF_TRUSTED_ORIGINS: https://eventops.example.com
